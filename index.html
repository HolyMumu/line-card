<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martin.Kao - LINE 電子名片</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1E293B;
    }
    .container {
      width: 100%;
      max-width: 380px;
    }
    .preview-card {
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 24px;
      border: 1px solid #E2E8F0;
      margin-bottom: 24px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #94A3B8;
      text-transform: uppercase;
    }
    .company {
      font-size: 16px;
      font-weight: 700;
      color: #0284C7;
      margin-top: 4px;
    }
    .name {
      font-size: 26px;
      font-weight: 800;
      color: #0F172A;
      margin-top: 14px;
    }
    .divider {
      height: 1px;
      background: #F1F5F9;
      margin: 18px 0;
    }
    .info-row {
      display: flex;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .info-label {
      width: 60px;
      color: #64748B;
      font-size: 13px;
    }
    .info-val {
      font-weight: 600;
      color: #1E293B;
    }
    .info-val.phone {
      color: #0284C7;
    }
    .card-btn {
      width: 100%;
      background: #0F172A;
      color: #FFF;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
      cursor: pointer;
    }
    .send-btn {
      width: 100%;
      background: #06C755;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(6, 199, 85, 0.35);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    .send-btn:active {
      transform: scale(0.98);
      background: #05ab49;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #94A3B8;
      margin-top: 12px;
      line-height: 1.5;
    }
    #status-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #DC2626;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 名片預覽卡片 -->
    <div class="preview-card">
      <div class="badge">DIGITAL BUSINESS CARD</div>
      <div class="company">Jioushun</div>
      <div class="name">Martin.Kao</div>
      <div style="font-size: 11px; color: #10B981; font-weight: bold; margin-top: 4px;">● 最新版本 v2.0 (已修正)</div>
      <div class="divider"></div>
      <div class="info-row">
        <span class="info-label">公司</span>
        <span class="info-val">Jioushun</span>
      </div>
      <div class="info-row">
        <span class="info-label">電話</span>
        <span class="info-val phone">0923-854-899</span>
      </div>
      <button class="card-btn" onclick="location.href='tel:0923854899'">撥打電話</button>
    </div>

    <!-- 轉發按鈕 -->
    <button class="send-btn" id="share-btn" onclick="sendCard()">
      <span>📲 選擇好友 / 群組發送名片</span>
    </button>
    
    <div id="status-msg"></div>
    <div class="hint">
      點擊上方按鈕後，會開啟 LINE 好友清單<br>勾選好友即可直接將名片送進聊天室
    </div>
  </div>

  <script>
    // ==========================================
    // 請將 YOUR_LIFF_ID 替換成在 LINE Developers 申請到的 LIFF ID
    // ==========================================
    const MY_LIFF_ID = "2012420969-6zr5NqdY";

    // Flex Message 定義
    const flexMessage = {
      type: "flex",
      altText: "Martin.Kao 的數位名片",
      contents: {
        type: "bubble",
        size: "mega",
        header: {
          type: "box",
          layout: "vertical",
          contents: [
            {
              type: "text",
              text: "DIGITAL BUSINESS CARD",
              size: "xxs",
              color: "#94A3B8",
              weight: "bold"
            },
            {
              type: "text",
              text: "Jioushun",
              size: "sm",
              weight: "bold",
              color: "#0284C7",
              margin: "xs"
            }
          ],
          paddingBottom: "none"
        },
        body: {
          type: "box",
          layout: "vertical",
          contents: [
            {
              type: "text",
              text: "Martin.Kao",
              size: "xxl",
              weight: "bold",
              color: "#0F172A"
            },
            {
              type: "separator",
              margin: "lg",
              color: "#E2E8F0"
            },
            {
              type: "box",
              layout: "vertical",
              margin: "lg",
              spacing: "sm",
              contents: [
                {
                  type: "box",
                  layout: "baseline",
                  spacing: "md",
                  contents: [
                    {
                      type: "text",
                      text: "公司",
                      color: "#64748B",
                      size: "xs",
                      flex: 1
                    },
                    {
                      type: "text",
                      text: "Jioushun",
                      color: "#1E293B",
                      size: "sm",
                      weight: "bold",
                      flex: 4
                    }
                  ]
                },
                {
                  type: "box",
                  layout: "baseline",
                  spacing: "md",
                  contents: [
                    {
                      type: "text",
                      text: "電話",
                      color: "#64748B",
                      size: "xs",
                      flex: 1
                    },
                    {
                      type: "text",
                      text: "0923-854-899",
                      color: "#0284C7",
                      size: "sm",
                      weight: "bold",
                      flex: 4
                    }
                  ]
                }
              ]
            }
          ]
        },
        footer: {
          type: "box",
          layout: "vertical",
          spacing: "sm",
          contents: [
            {
              type: "button",
              style: "primary",
              height: "sm",
              action: {
                type: "uri",
                label: "撥打電話",
                uri: "tel:0923854899"
              },
              color: "#0F172A"
            }
          ],
          flex: 0
        }
      }
    };

    // 初始化 LIFF
    async function main() {
      if (MY_LIFF_ID === "YOUR_LIFF_ID") {
        showStatus("⚠️ 請先將 HTML 裡的 YOUR_LIFF_ID 換成您在 LINE Developers 申請的真實 LIFF ID。");
        return;
      }

      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (err) {
        showStatus("LIFF 初始化失敗：" + err.message);
      }
    }

    async function sendCard() {
      if (MY_LIFF_ID === "YOUR_LIFF_ID") {
        alert("請先將 index.html 裡的 YOUR_LIFF_ID 改為您申請到的 LIFF ID！");
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      if (liff.isApiAvailable('shareTargetPicker')) {
        try {
          const res = await liff.shareTargetPicker([flexMessage]);
          if (res) {
            alert("✅ 名片已成功發送！");
            setTimeout(() => {
              liff.closeWindow();
            }, 500);
          } else {
            showStatus("⚠️ 發送已被取消或中斷。");
          }
        } catch (error) {
          alert("❌ 發送失敗：" + error.message);
          showStatus("發送失敗：" + error.message);
        }
      } else {
        alert("當前環境不支援 ShareTargetPicker，請確認 LINE 後台的 Share Target Picker 是否已開啟為 ON。");
      }
    }

    function showStatus(msg) {
      const el = document.getElementById("status-msg");
      el.innerText = msg;
      el.style.display = "block";
    }

    main();
  </script>
</body>
</html>
